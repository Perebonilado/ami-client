<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Àmì · Sign up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="app.css">
<style>
  .auth { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: clamp(32px, 6vw, 96px); min-height: 100svh; padding: 20px 0; }
  .side { display: flex; flex-direction: column; }
  .side-top { display: flex; align-items: center; justify-content: space-between; height: 56px; }
  .side-top a.swap { font-weight: 600; }
  .side-top a.swap:hover { text-decoration: underline; text-underline-offset: 4px; }
  .form-wrap { flex: 1; display: grid; align-content: center; width: 100%; max-width: 420px; margin: 0 auto; padding: 48px 0; }
  .form-wrap h1 { font-size: clamp(34px, 3.8vw, 48px); line-height: 1.02; }
  .form { display: grid; gap: 20px; margin-top: 36px; }
  .pw { position: relative; }
  .pw .input { padding-right: 72px; }
  .pw button { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); height: 36px; padding: 0 12px; border: 0; border-radius: 10px; background: none; cursor: pointer; font: 600 14px/1 var(--body); color: var(--ink); }
  .pw button:hover { background: var(--wash); }
  .form .btn { width: 100%; height: 56px; margin-top: 8px; font-size: 16px; }
  .alt { margin-top: 28px; text-align: center; font-size: 15px; color: var(--ink-2); }
  .alt a { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
  .art { position: sticky; top: 20px; height: calc(100svh - 40px); border-radius: 28px; overflow: hidden; background: #c96f2c; }
  .art video { width: 100%; height: 100%; object-fit: cover; display: block; }
  @media (max-width: 900px) {
    .auth { grid-template-columns: 1fr; }
    .art { display: none; }
    .form-wrap { align-content: start; padding-top: 32px; }
  }
</style>
</head>
<body>
<div class="wrap auth">
  <div class="side">
    <div class="side-top">
      <a class="logo" href="d.html" aria-label="Àmì home"><span class="m m-a">A</span>m<span class="m m-i">ı</span></a>
      <a class="swap" href="login.html">Log in</a>
    </div>
    <main class="form-wrap">
      <h1>Create your account</h1>
      <form class="form" id="form" novalidate>
        <div class="f" data-f="name">
          <label for="name">Full name</label>
          <input class="input" id="name" type="text" placeholder="Tolu Adeyemi" autocomplete="name">
          <p class="ferr" hidden>Enter your name.</p>
        </div>
        <div class="f" data-f="email">
          <label for="email">Email</label>
          <input class="input" id="email" type="email" placeholder="you@example.com" autocomplete="email">
          <p class="ferr" hidden>Enter a valid email address.</p>
        </div>
        <div class="f" data-f="password">
          <label for="password">Password</label>
          <div class="pw"><input class="input" id="password" type="password" placeholder="At least 8 characters" autocomplete="new-password"><button type="button" aria-label="Show password">Show</button></div>
          <p class="ferr" hidden>Use at least 8 characters.</p>
        </div>
        <button class="btn btn-ink" type="submit">Create account</button>
      </form>
      <p class="alt">Already have an account? <a href="login.html">Log in</a></p>
    </main>
  </div>
  <div class="art" aria-hidden="true">
    <video muted loop autoplay playsinline poster="https://images.pexels.com/videos/5664462/african-dancing-headphones-listening-5664462.jpeg?auto=compress&cs=tinysrgb&w=1400" src="https://videos.pexels.com/video-files/5664462/5664462-hd_1280_720_50fps.mp4"></video>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const mark = (f, bad) => { const el = document.querySelector(`.f[data-f="${f}"]`); el.classList.toggle("has-err", bad); el.querySelector(".ferr").hidden = !bad; };
  document.querySelectorAll(".input").forEach((i) => i.addEventListener("input", () => mark(i.closest(".f").dataset.f, false)));
  const pwBtn = document.querySelector(".pw button");
  pwBtn.addEventListener("click", () => { const i = $("password"), show = i.type === "password"; i.type = show ? "text" : "password"; pwBtn.textContent = show ? "Hide" : "Show"; });
  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const bad = {name: !$("name").value.trim(), email: !/^\S+@\S+\.\S+$/.test($("email").value.trim()), password: $("password").value.length < 8};
    Object.entries(bad).forEach(([f, b]) => mark(f, b));
    const first = Object.keys(bad).find((f) => bad[f]);
    if (first) { $(first).focus(); return; }
    location.href = "library.html";
  });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelector(".art video").removeAttribute("autoplay");
</script>
<script src="screens.js"></script>
</body>
</html>
