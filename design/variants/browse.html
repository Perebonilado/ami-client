<style>
  .nav-links a[aria-current] { color: var(--ink); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ---------- Search: one calm bar; the licence setting sits inside it ---------- */
  .finder { padding-top: clamp(20px, 3vw, 36px); }
  .bar {
    position: relative; display: flex; align-items: center; gap: 12px;
    max-width: 760px; height: 64px; margin-inline: auto; padding: 0 16px 0 24px; border-radius: 999px;
    background: #fff; box-shadow: 0 0 0 1px #e6e5ec, 0 10px 28px -14px rgb(15 15 16 / 0.25);
    transition: box-shadow 0.3s var(--ease);
  }
  .bar:focus-within { box-shadow: 0 0 0 2px var(--ink), 0 16px 36px -16px rgb(15 15 16 / 0.32); }
  .bar > .icon { width: 20px; height: 20px; flex: none; color: var(--ink); }
  .bar input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; background: none; outline: none; font: 400 17px/1 var(--body); color: var(--ink); }
  .bar input::placeholder { color: var(--ink-2); opacity: 1; transition: opacity 0.35s; }
  .bar input.is-swapping::placeholder { opacity: 0; }
  .bar input::-webkit-search-cancel-button { display: none; }
  .clear { flex: none; width: 32px; height: 32px; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer; background: var(--wash); color: var(--ink); }
  .clear:hover { background: #e9e8ef; }
  .clear[hidden] { display: none; }
  .clear svg { width: 14px; height: 14px; }

  /* Popover menus */
  .pop {
    position: absolute; top: calc(100% + 12px); z-index: 30; min-width: 320px; padding: 10px;
    border-radius: 24px; background: #fff; box-shadow: 0 0 0 1px rgb(15 15 16 / 0.04), 0 16px 40px -12px rgb(15 15 16 / 0.28);
    opacity: 0; transform: translateY(-6px); pointer-events: none; transition: opacity 0.18s, transform 0.25s var(--ease);
  }
  .pop.is-open { opacity: 1; transform: none; pointer-events: auto; }
  .pop [role="option"] {
    display: grid; grid-template-columns: 1fr 20px; align-items: center; gap: 2px 14px; width: 100%;
    padding: 12px 14px; border: 0; border-radius: 14px; background: none; text-align: left; cursor: pointer; color: var(--ink);
  }
  .pop [role="option"]:hover, .pop [role="option"]:focus-visible { background: var(--wash); outline: none; }
  .opt-name { font: 600 15px/1.25 var(--body); }
  .opt-desc { grid-column: 1; font: 400 14px/1.35 var(--body); color: var(--ink-2); }
  .opt-check { grid-column: 2; grid-row: 1 / span 2; width: 20px; height: 20px; color: var(--ink); opacity: 0; }
  .pop [aria-selected="true"] .opt-check { opacity: 1; }

  /* ---------- Category rail: icon above label, underline marks the active one ---------- */
  .rail-wrap { position: sticky; top: 76px; z-index: 15; margin-top: 28px; background: #fff; transition: box-shadow 0.2s; }
  .rail-wrap.is-stuck { box-shadow: 0 1px 0 #ececf0, 0 10px 20px -18px rgb(15 15 16 / 0.35); }
  .rail { display: flex; justify-content: center; gap: clamp(28px, 4vw, 48px); overflow-x: auto; scrollbar-width: none; padding-top: 14px; }
  .rail::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 2px 12px;
    border: 0; border-bottom: 2px solid transparent; background: none; cursor: pointer;
    font: 600 13px/1 var(--body); color: var(--ink-2); transition: color 0.2s, border-color 0.2s;
  }
  .cat-btn svg { width: 26px; height: 26px; stroke-width: 1.6; opacity: 0.75; transition: opacity 0.2s, transform 0.3s var(--ease); }
  .cat-btn:hover { color: var(--ink); border-bottom-color: #dcdce2; }
  .cat-btn:hover svg { opacity: 1; transform: translateY(-1px); }
  .cat-btn[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .cat-btn[aria-pressed="true"] svg { opacity: 1; }
  .rail-line { height: 1px; background: #ececf0; }

  /* ---------- Results ---------- */
  .results-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-top: 36px; }
  .results-head h1 { font: 700 22px/1.2 var(--head); letter-spacing: -0.02em; }
  .results-head p { margin-top: 4px; font-size: 15px; color: var(--ink-2); }
  .sort { position: relative; flex: none; }
  .sort-btn {
    display: inline-flex; align-items: center; gap: 10px; height: 44px; padding: 0 16px; border: 0; border-radius: 14px; cursor: pointer;
    background: #fff; box-shadow: inset 0 0 0 1px #dedde5; font: 600 14px/1 var(--body); color: var(--ink); transition: box-shadow 0.2s;
  }
  .sort-btn:hover { box-shadow: inset 0 0 0 1px var(--ink); }
  .sort-btn svg { width: 18px; height: 18px; }
  .sort .pop { right: 0; min-width: 240px; top: calc(100% + 8px); }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 44px 24px; margin-top: 28px; }
  .card { display: block; outline: none; color: var(--ink); }
  .card[hidden] { display: none; }
  .thumb {
    position: relative; aspect-ratio: 4 / 5; overflow: hidden; isolation: isolate; border-radius: 20px;
    background: #141216; transition: transform 0.45s var(--ease), box-shadow 0.45s var(--ease);
  }
  .card:hover .thumb, .card:focus-visible .thumb { transform: translateY(-4px); box-shadow: 0 2px 4px rgb(15 15 16 / 0.08), 0 24px 40px -22px rgb(15 15 16 / 0.45); }
  .card:focus-visible .thumb { outline: 2px solid var(--brand); outline-offset: 3px; }
  .thumb video { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover; transform: scale(1.02); transition: transform 1.2s var(--ease); }
  .card.is-playing .thumb video { transform: scale(1.07); }
  .thumb::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, transparent 74%, rgb(10 8 12 / 0.5)); }
  .badge {
    position: absolute; top: 12px; left: 12px; display: inline-flex; align-items: center; height: 26px; padding: 0 11px;
    border-radius: 999px; background: var(--brand); color: #fff; font: 600 12.5px/1 var(--body); letter-spacing: 0.01em;
    box-shadow: 0 1px 2px rgb(15 15 16 / 0.2), 0 6px 14px -6px rgb(29 78 216 / 0.55), inset 0 1px 0 rgb(255 255 255 / 0.2);
  }
  .dur { position: absolute; right: 14px; bottom: 12px; font: 600 13px/1 var(--body); font-variant-numeric: tabular-nums; color: #fff; text-shadow: 0 1px 6px rgb(0 0 0 / 0.35); }

  .info { margin-top: 14px; }
  .info h3 { font: 600 16px/1.35 var(--body); letter-spacing: -0.005em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .info .who { display: flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 15px; line-height: 1.4; color: var(--ink-2); }
  .info .who span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tick { width: 16px; height: 16px; flex: none; color: var(--brand); }

  .empty { padding: 88px 0 16px; text-align: center; }
  .empty h2 { font-size: clamp(26px, 3vw, 36px); line-height: 1.1; }
  .empty p { margin-top: 10px; color: var(--ink-2); font-size: 17px; }
  .empty .btn { margin-top: 26px; }
  .more { display: flex; justify-content: center; margin-top: 64px; }
  .foot { margin-top: clamp(96px, 10vw, 140px); }

  @media (max-width: 860px) {
    .bar { height: 56px; padding: 0 14px 0 18px; gap: 10px; }
    .bar input { font-size: 16px; }
    .rail-wrap { top: 64px; margin-top: 20px; }
    .rail { justify-content: flex-start; gap: 28px; padding-inline: var(--gutter); margin-inline: calc(-1 * var(--gutter)); }
    .results-head { margin-top: 28px; }
    .grid { grid-template-columns: 1fr 1fr; gap: 32px 12px; margin-top: 22px; }
    .badge { top: 10px; left: 10px; height: 24px; padding: 0 10px; font-size: 12px; }
    .info { margin-top: 10px; }
    .info h3 { font-size: 15px; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .info .who { font-size: 14px; }
  }
</style>

<script>
  const P = "https://images.pexels.com/videos/", V = "https://videos.pexels.com/video-files/";
  const poster = (p) => `${P}${p}.jpeg?auto=compress&cs=tinysrgb&fit=crop&w=600&h=750`;
  const DEF = [10000, 50000, 150000];
  // Demo catalogue: titles, creators and prices from the seeded mock data; clips are Pexels placeholders.
  const CLIPS = [
    { t: "When the light comes back at 3am", by: "Tolu Adeyemi", ok: 1, cat: "Comedy", d: "0:58", age: 3, tags: "nepa light lagos man laughing smiling happy night", img: "8496469/adult-bald-black-model-business-8496469", vid: "8496469/8496469-sd_960_540_25fps.mp4" },
    { t: "Danfo conductor vs. ₦50 change", by: "Chinedu Okafor", cat: "Comedy", d: "1:03", age: 5, tags: "danfo bus conductor transport lagos man laughing close up", img: "4994324/pexels-photo-4994324", vid: "4994324/4994324-sd_540_960_25fps.mp4" },
    { t: "Shoki footwork in 60 seconds", by: "Kemi Johnson", cat: "Dance", d: "1:00", age: 6, p: [20000, 80000, 200000], tags: "dance dancing tutorial afrobeats women studio footwork", img: "8956007/pexels-photo-8956007", vid: "8956007/8956007-sd_540_960_25fps.mp4" },
    { t: "Jollof wars: Lagos vs. Accra", by: "Aisha Bello", cat: "Food", d: "2:00", age: 8, p: [10000, 40000, 120000], tags: "jollof rice recipe ghana food plate cooking", img: "10200319/pexels-photo-10200319", vid: "10200319/10200319-sd_540_960_25fps.mp4" },
    { t: "My mum when I say I’m not hungry", by: "Tolu Adeyemi", ok: 1, cat: "Comedy", d: "0:42", age: 12, tags: "family food mum mother woman talking home sofa", img: "7594690/access-adult-african-american-analyzing-7594690", vid: "7594690/7594690-sd_960_540_25fps.mp4" },
    { t: "Suya at midnight", by: "Aisha Bello", cat: "Food", d: "0:47", age: 15, tags: "suya street food asmr grilled meat skewers night", img: "35610097/pexels-photo-35610097", vid: "35610097/15091195_540_960_24fps.mp4" },
    { t: "Landlord’s ‘small increase’", by: "Chinedu Okafor", cat: "Comedy", d: "0:51", age: 18, tags: "rent landlord man filming himself phone tripod skit", img: "8360259/pexels-photo-8360259", vid: "8360259/8360259-sd_960_506_25fps.mp4" },
    { t: "How to bargain at Balogun market", by: "Aisha Bello", cat: "Lifestyle", d: "1:22", age: 22, tags: "market shopping lagos woman selling food tray trader", img: "27165163/abuja-market-african-market-bariga-market-business-woman-27165163", vid: "27165163/12087846_960_540_25fps.mp4" },
    { t: "First day at a Lagos startup", by: "Tolu Adeyemi", ok: 1, cat: "Lifestyle", d: "1:14", age: 25, tags: "work tech lagos office man talking to camera", img: "4994033/pexels-photo-4994033", vid: "4994033/4994033-sd_960_540_25fps.mp4" },
    { t: "Owambe aunty seat negotiations", by: "Kemi Johnson", cat: "Owambe", d: "0:55", age: 28, tags: "owambe party aunty wedding couple dancing aso oke purple celebration", img: "37964255/pexels-photo-37964255", vid: "37964255/16109125_540_960_24fps.mp4", end: 8 },
    { t: "POV: your driver is also a pastor", by: "Chinedu Okafor", cat: "Comedy", d: "1:28", age: 33, tags: "ride driver church pastor man laughing hoodie", img: "4994037/pexels-photo-4994037", vid: "4994037/4994037-sd_960_540_25fps.mp4" },
    { t: "The wedding MC who won’t stop talking", by: "Kemi Johnson", cat: "Owambe", d: "1:09", age: 37, p: [15000, 60000, 0], tags: "wedding mc bride veil purple ceremony celebration", img: "38299946/pexels-photo-38299946", vid: "38299946/16262938_540_960_24fps.mp4", end: 8 },
  ];
  const USES = [
    { name: "Repost", phrase: "to repost", desc: "Post it as-is, with credit to the creator." },
    { name: "Social", phrase: "for social posts", desc: "Edit it and add your branding. No paid ads." },
    { name: "Advert", phrase: "for adverts", desc: "Use it in paid promotion." },
  ];
  const SORTS = [{ name: "Newest" }, { name: "Price: low to high" }, { name: "Price: high to low" }];
  const CATS = [["All", "c-all"], ["Comedy", "c-comedy"], ["Food", "c-food"], ["Dance", "c-dance"], ["Owambe", "c-owambe"], ["Lifestyle", "c-lifestyle"]];
  const STOP = new Set(["the", "and", "for", "with", "her", "his", "their", "that", "this", "from", "who", "are", "was", "someone", "video", "videos", "clip", "clips"]);
  const naira = (n) => "₦" + n.toLocaleString("en-NG");
  const prices = (c) => c.p || DEF;

  const state = { cat: new URLSearchParams(location.search).get("cat") || "All", use: -1, sort: 0, q: "" };
  if (!CATS.some(([c]) => c === state.cat)) state.cat = "All";

  // The price a card shows: the chosen licence, or the cheapest one the creator offers.
  const priceFor = (c) => {
    const p = prices(c);
    const i = state.use >= 0 ? state.use : p.findIndex(Boolean);
    return p[i] ? { amount: p[i], phrase: USES[i].phrase } : null;
  };

  // Category rail
  const rail = document.getElementById("rail");
  rail.innerHTML = CATS.map(([c, icon]) => `<button class="cat-btn" type="button" aria-pressed="${c === state.cat}" data-cat="${c}"><svg class="icon"><use href="#${icon}"/></svg>${c}</button>`).join("");
  rail.addEventListener("click", (e) => {
    const b = e.target.closest(".cat-btn"); if (!b) return;
    state.cat = b.dataset.cat;
    rail.querySelectorAll(".cat-btn").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });

  // Cards
  const grid = document.getElementById("grid");
  grid.innerHTML = CLIPS.map((c, i) => `
    <a class="card" href="video.html" data-i="${i}">
      <div class="thumb">
        <video muted loop playsinline preload="none" poster="${poster(c.img)}" data-src="${V}${c.vid}" ${c.end ? `data-loop-end="${c.end}"` : ""}></video>
        ${c.age <= 7 ? '<span class="badge">New</span>' : ""}
        <span class="dur">${c.d}</span>
      </div>
      <div class="info">
        <h3>${c.t}</h3>
        <p class="who"><span>${c.by}</span>${c.ok ? '<svg class="tick" aria-label="Verified creator"><use href="#i-tick"/></svg>' : ""}</p>
      </div>
    </a>`).join("");
  const cards = [...grid.children];

  // Sort menu
  const bar = document.getElementById("bar");
  const menus = {
    sort: { items: SORTS, get: () => state.sort, set: (i) => (state.sort = i), label: document.getElementById("sort-value") },
  };
  const check = '<svg class="opt-check icon"><use href="#i-check"/></svg>';
  function paintMenu(key) {
    const m = menus[key], cur = m.get();
    document.getElementById(`pop-${key}`).innerHTML = m.items.map((it, i) =>
      `<button type="button" role="option" aria-selected="${i === cur}" data-i="${i}"><span class="opt-name">${it.name}</span>${it.desc ? `<span class="opt-desc">${it.desc}</span>` : ""}${check}</button>`).join("");
    m.label.textContent = m.items[cur].name;
  }
  let openKey = null;
  function toggle(key, force) {
    const willOpen = force ?? openKey !== key;
    if (openKey) {
      document.getElementById(`pop-${openKey}`).classList.remove("is-open");
      const t = document.querySelector(`[data-pop="${openKey}"]`); t.setAttribute("aria-expanded", "false"); t.classList.remove("is-active");
    }
    openKey = willOpen ? key : null;
    if (openKey) {
      const pop = document.getElementById(`pop-${key}`), t = document.querySelector(`[data-pop="${key}"]`);
      pop.classList.add("is-open"); t.setAttribute("aria-expanded", "true"); t.classList.add("is-active");
    }
  }
  document.querySelectorAll("[data-pop]").forEach((t) => t.addEventListener("click", (e) => { e.stopPropagation(); toggle(t.dataset.pop); }));
  Object.keys(menus).forEach((key) => {
    paintMenu(key);
    document.getElementById(`pop-${key}`).addEventListener("click", (e) => {
      e.stopPropagation();
      const o = e.target.closest("[role=option]"); if (!o) return;
      menus[key].set(+o.dataset.i); paintMenu(key); toggle(key, false); render();
    });
  });
  document.addEventListener("click", () => openKey && toggle(openKey, false));
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && openKey) toggle(openKey, false); });

  // Filtering and sorting
  const q = document.getElementById("q"), head = document.getElementById("results-h");
  const empty = document.getElementById("empty"), more = document.getElementById("more");
  function render() {
    const raw = q.value.trim(), words = raw.toLowerCase().split(/[^a-z0-9₦]+/).filter((w) => w.length > 2 && !STOP.has(w));
    document.getElementById("clear").hidden = !raw;
    // Stand-in for semantic search: score each clip by how many of the searched words it matches.
    const score = new Map();
    const shown = cards.filter((el) => {
      const c = CLIPS[el.dataset.i], hay = `${c.t} ${c.by} ${c.cat} ${c.tags}`.toLowerCase();
      const hits = words.filter((w) => hay.includes(w)).length;
      score.set(el, hits);
      const ok = (state.cat === "All" || c.cat === state.cat)
        && (!words.length || hits >= Math.ceil(words.length / 2))
        && !!priceFor(c);
      el.hidden = !ok;
      return ok;
    });
    const key = [(c) => c.age, (c) => priceFor(c).amount, (c) => -priceFor(c).amount][state.sort];
    shown.sort((a, b) => (words.length ? score.get(b) - score.get(a) : 0) || key(CLIPS[a.dataset.i]) - key(CLIPS[b.dataset.i])).forEach((el) => grid.appendChild(el));
    const n = `${shown.length} ${shown.length === 1 ? "video" : "videos"}`;
    head.textContent = raw ? `${n} for “${raw}”` : n;
    empty.hidden = shown.length > 0;
    more.hidden = shown.length < 8;
  }
  q.addEventListener("input", render);
  document.getElementById("clear").addEventListener("click", () => { q.value = ""; q.focus(); render(); });
  document.getElementById("reset").addEventListener("click", () => {
    q.value = ""; state.cat = "All"; state.use = -1;
    rail.querySelectorAll(".cat-btn").forEach((x) => x.setAttribute("aria-pressed", String(x.dataset.cat === "All")));
    render();
  });
  render();

  // Placeholder rotates through example searches while the field is empty
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    const narrow = matchMedia("(max-width: 480px)").matches;
    const hints = [narrow ? "Search or describe a moment" : "Search creators, titles or describe a moment", "Try “bride dancing at a wedding”", "Try “jollof rice being served”", "Try “man laughing hard”", "Try “Aisha Bello”"];
    q.placeholder = hints[0];
    let h = 0;
    setInterval(() => {
      if (q.value || document.activeElement === q) return;
      q.classList.add("is-swapping");
      setTimeout(() => { h = (h + 1) % hints.length; q.placeholder = hints[h]; q.classList.remove("is-swapping"); }, 350);
    }, 3200);
  }

  // Category rail shadow once it sticks under the nav
  new IntersectionObserver(([e]) => document.getElementById("rail-wrap").classList.toggle("is-stuck", !e.isIntersecting), { rootMargin: "-140px 0px 0px 0px" })
    .observe(document.getElementById("rail-sentinel"));

  // Hover (or focus) plays a muted, looping preview; on touch screens a card plays while mostly in view.
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const finePointer = matchMedia("(hover: hover) and (pointer: fine)").matches;
  cards.forEach((card) => {
    const v = card.querySelector("video"), end = parseFloat(v.dataset.loopEnd);
    card.play = () => { if (reduceMotion) return; if (!v.src) v.src = v.dataset.src; v.play().catch(() => {}); };
    card.stop = () => v.pause();
    v.addEventListener("playing", () => card.classList.add("is-playing"));
    v.addEventListener("pause", () => card.classList.remove("is-playing"));
    if (end) v.addEventListener("timeupdate", () => { if (v.currentTime >= end) v.currentTime = 0; });
    if (finePointer) {
      card.addEventListener("mouseenter", card.play); card.addEventListener("mouseleave", card.stop);
      card.addEventListener("focus", card.play); card.addEventListener("blur", card.stop);
    }
  });
  if (!finePointer && !reduceMotion && "IntersectionObserver" in window) {
    const io = new IntersectionObserver((es) => es.forEach((e) => (e.intersectionRatio >= 0.75 ? e.target.play() : e.target.stop())), { threshold: [0, 0.75] });
    cards.forEach((c) => io.observe(c));
  }
</script>
<script src="screens.js"></script>
</body>
